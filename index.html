<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meet - WebRTC</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#0f1724;--card:#111827;--accent:#7c3aed;--muted:#9ca3af;--text:#e6eef8}
    body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial;background:linear-gradient(120deg,#071029 0%, #071834 100%);color:var(--text);display:flex;align-items:center;justify-content:center;height:100vh}
    .app{width:980px;max-width:95%;background:rgba(255,255,255,0.02);border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    header h1{font-size:18px;margin:0}
    .controls{display:flex;gap:8px;align-items:center}
    input[type=text]{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:8px;border-radius:8px}
    button{background:var(--accent);border:none;color:white;padding:8px 12px;border-radius:8px;cursor:pointer}
    .layout{display:flex;gap:12px}
    .videos{flex:1;display:flex;flex-direction:column;gap:12px}
    .video-row{display:flex;gap:12px}
    video{flex:1;border-radius:8px;background:#000;object-fit:cover;height:340px}
    .sidebar{width:280px}
    .card{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px}
    .mutebtn{background:#111827;border:1px solid rgba(255,255,255,0.03)}
    .status{color:var(--muted);font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Meet — Video Calls</h1>
      <div class="controls">
        <input id="nick" type="text" placeholder="Your nickname" />
        <input id="room" type="text" placeholder="Room code (auto)" />
        <button id="gen">Generate</button>
        <button id="join">Connect</button>
        <button id="leave" style="display:none;background:#ef4444">Leave</button>
      </div>
    </header>

    <div class="layout">
      <div class="videos">
        <div class="video-row">
          <video id="local" autoplay muted playsinline></video>
          <video id="remote" autoplay playsinline></video>
        </div>
        <div class="card" style="display:flex;gap:8px;align-items:center">
          <button id="toggleAudio" class="mutebtn">Mute mic</button>
          <button id="toggleVideo" class="mutebtn">Disable cam</button>
          <div class="status" id="status">Disconnected</div>
        </div>
      </div>
      <aside class="sidebar">
        <div class="card">
          <h3>Room Link</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <div id="link" style="word-break:break-all;color:#a5b4fc;flex:1"></div>
            <button id="copyLink" style="background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:6px 8px;border-radius:6px">Copy</button>
          </div>
          <p class="status">Share room code or the link with your peer.</p>
        </div>
        <div class="card" style="margin-top:12px">
          <h3>Participants</h3>
          <ul id="peers" style="margin:0;padding-left:18px;color:var(--muted)"></ul>
        </div>
      </aside>
    </div>
  </div>
  <script src="client.js"></script>
</body>
</html>
